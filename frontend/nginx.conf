# frontend/nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # docker-compose only: forward API calls to the backend service.
  # Using a variable + Docker's DNS resolver means nginx still starts even if the
  # backend container is not up yet (or does not exist, e.g. a standalone frontend image).
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}